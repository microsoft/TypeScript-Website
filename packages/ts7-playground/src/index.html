<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="__PLAYGROUND_BASE__" />
    <script>
      const playgroundBase = "__PLAYGROUND_BASE__"
      if (playgroundBase !== "/" && location.pathname === playgroundBase.slice(0, -1)) {
        const url = new URL(location.href)
        url.pathname = playgroundBase
        location.replace(url)
      }
    </script>
    <script src="./coi-serviceworker.min.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>TypeScript 7 Playground</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <main class="playground">
      <header class="toolbar">
        <div>
          <h1>TypeScript 7 Playground</h1>
        </div>
        <div class="toolbar-actions">
          <label class="version-control">
            <span>Compiler</span>
            <select id="compiler-version" aria-label="Select compiler version">
              <option value="native">Native 7.1</option>
            </select>
          </label>
          <button id="run-button" type="button" disabled>Run</button>
          <output id="status" class="status">Loading compiler...</output>
        </div>
      </header>
      <section class="workspace" aria-label="TypeScript playground">
        <nav id="file-explorer" class="file-explorer" aria-label="Project files">
          <div class="file-explorer-heading">
            <div>
              <h2>Project</h2>
              <span>/workspace</span>
            </div>
            <div class="file-explorer-actions">
              <button
                id="mobile-files-toggle"
                class="mobile-files-toggle"
                type="button"
                aria-controls="file-list"
                aria-expanded="true"
              >
                Hide
              </button>
              <button id="reset-project-button" type="button" title="Reset the project">Reset</button>
              <button id="new-file-button" type="button" title="Create a new file">+ File</button>
            </div>
          </div>
          <div id="file-list" class="file-list"></div>
        </nav>
        <div class="editor-panel">
          <div class="panel-heading">
            <div class="editor-heading-title">
              <div class="editor-navigation" role="group" aria-label="Editor navigation">
                <button id="navigate-back-button" type="button" title="Go back" aria-label="Go back" disabled>←</button>
                <button id="navigate-forward-button" type="button" title="Go forward" aria-label="Go forward" disabled>
                  →
                </button>
              </div>
              <h2 id="current-file">index.ts</h2>
            </div>
            <div class="editor-heading-actions">
              <span id="editor-hint">Type query: align <code>^?</code> below an expression</span>
              <button id="delete-file-button" type="button">Delete</button>
            </div>
          </div>
          <div id="input-editor" class="editor"></div>
        </div>
        <aside class="output-panel">
          <div class="panel-heading">
            <h2>Emit</h2>
            <span id="emit-summary">Waiting for the compiler</span>
          </div>
          <details id="diagnostics-panel" class="diagnostics-panel">
            <summary>
              <span>Problems</span>
              <span id="diagnostics-summary">0</span>
            </summary>
            <div id="diagnostics-list" class="diagnostics-list">
              <p class="empty-message">No problems found.</p>
            </div>
          </details>
          <div id="emit-output" class="emit-output"></div>
          <section id="run-output" class="run-output" aria-live="polite">
            <header>
              <h2>Run output</h2>
              <button id="clear-run-output" type="button">Clear</button>
            </header>
            <div id="run-log" class="run-log">
              <p class="empty-message">Run the project to see console output.</p>
            </div>
          </section>
        </aside>
      </section>
      <div id="loader" class="loading-overlay">
        <div class="loading-card">
          <div class="lds-grid" aria-hidden="true">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
          </div>
          <div class="loading-copy">
            <p id="loading-message" role="status">Downloading TypeScript...</p>
            <progress id="loading-progress" max="100" value="0"></progress>
            <small id="loading-detail">Preparing downloads</small>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
